name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, format, typecheck, test and build
        run: npm run check

  deploy:
    name: Deploy to Vercel
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: '62.2.0'
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment secrets
        shell: bash
        run: |
          for variable in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub secret: $variable. See docs/CI_CD.md."
              exit 1
            fi
          done
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull project settings and environment
        run: vercel pull --yes --environment="$DEPLOY_TARGET" --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        shell: bash
        run: |
          flags=()
          if [[ "$DEPLOY_TARGET" == production ]]; then
            flags+=(--prod)
          fi
          vercel build "${flags[@]}" --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          flags=()
          if [[ "$DEPLOY_TARGET" == production ]]; then
            flags+=(--prod)
          fi
          url=$(vercel deploy --prebuilt --yes "${flags[@]}" --token="$VERCEL_TOKEN")
          if [[ "$url" != https://* || "$url" == *$'\n'* ]]; then
            echo '::error::Vercel did not return a single HTTPS deployment URL.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### Vercel deployment\n\nTarget: %s\n\nURL: %s\n\nCommit: %s\n' \
            "$DEPLOY_TARGET" "$url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
